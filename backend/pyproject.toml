[project]
name = "leonit-backend"
version = "0.1.0"
description = "LeonIT — API асинхронного видеоинтервью с ИИ-оценкой кандидатов"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.124",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "email-validator>=2.3",
    "sqlalchemy[asyncio]>=2.0.45",
    "alembic>=1.17",
    "aiosqlite>=0.21",
    "asyncpg>=0.31",
    "httpx>=0.28",
    "python-jose[cryptography]>=3.5",
    "python-multipart>=0.0.20",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "respx>=0.22",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# Один event loop на весь прогон: пул asyncpg привязан к loop, и функция-loop
# на каждый тест ломала соединения PostgreSQL («attached to a different loop»).
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:leonit.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["leonit"]
# Каталог alembic/ лежит рядом с кодом, но сам пакет alembic — сторонний.
known-third-party = ["alembic"]
