name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Установить зависимости
        run: uv sync --frozen
      - name: Линт
        run: uv run ruff check . && uv run ruff format --check .
      - name: Тесты
        run: uv run pytest -q

  backend-postgres:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: leonit_test
          POSTGRES_USER: leonit
          POSTGRES_PASSWORD: leonit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leonit -d leonit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://leonit:leonit@localhost:5432/leonit_test
      DATABASE_URL: postgresql+asyncpg://leonit:leonit@localhost:5432/leonit_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Установить зависимости
        run: uv sync --frozen
      - name: Миграции на чистой базе
        run: uv run alembic upgrade head && uv run alembic check
      - name: Тесты на PostgreSQL
        run: uv run pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Установить зависимости
        run: npm ci
      - name: Типы
        run: npm run typecheck
      - name: Линт
        run: npm run lint
      - name: Тесты
        run: npm test
      - name: Сборка
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
